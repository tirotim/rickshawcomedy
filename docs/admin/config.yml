# Rick Shaw Comedy — content editor
# Local: run `npm run cms:site` and `npm run cms`, open http://localhost:8080/admin/
# Live: https://tirotim.github.io/rickshawcomedy/admin/ (needs GitHub OAuth app)

site_url: https://tirotim.github.io/rickshawcomedy
display_url: https://tirotim.github.io/rickshawcomedy

editor:
  preview: true

backend:
  name: github
  repo: tirotim/rickshawcomedy
  branch: main
  base_url: https://tirotim.github.io
  site_domain: tirotim.github.io

# Uncomment only for local editing on your computer:
# local_backend: true

media_folder: versions/modern-gold/gallery
public_folder: gallery

collections:
  - name: nostalgic_knights
    label: "Nostalgic Knights"
    label_singular: "Nostalgic Knights"
    files:
      - name: page
        label: "Edit this page"
        file: content/pages/nostalgic-knights.json
        preview_path: nostalgic-knights.html
        editor:
          preview: true
        fields:
          - { label: "Page title", name: pageTitle, widget: string, hint: "Large heading at the top" }
          - { label: "Short line under the title", name: lede, widget: string }
          - { label: "Introduction paragraph", name: intro, widget: text }
          - { label: "Sidebar heading — comedy list", name: comedySectionHeading, widget: string, default: "Comedy entertainers" }
          - label: "Comedy characters (big profiles with photo & text)"
            name: comedyCharacters
            widget: list
            summary: "{{fields.title}}"
            hint: "Click + to add. Shows in the sidebar jump list too."
            fields:
              - { label: "Rick's character name", name: title, widget: string, hint: "e.g. Fame Edin-Bra Beverage" }
              - { label: "Who they imitate", name: imitates, widget: string, hint: "e.g. Dame Edna Everage" }
              - { label: "Extra note (optional)", name: captionNote, widget: string, hint: "e.g. Sir Michael Crawford" }
              - { label: "Photo", name: image, widget: image }
              - { label: "First paragraph", name: paragraph1, widget: text }
              - { label: "Second paragraph", name: paragraph2, widget: text }
              - { label: "Not finished yet — tick if coming soon", name: comingSoon, widget: boolean, default: false }
          - { label: "Musical section heading", name: musicalSectionHeading, widget: string, default: "Musical \"Sirs\" & dames" }
          - { label: "Musical section note", name: musicalNote, widget: text, hint: "Short paragraph above the musical cards" }
          - label: "Musical Sirs & dames (smaller cards)"
            name: musicalCharacters
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: "Character name", name: title, widget: string }
              - { label: "Who they imitate", name: imitates, widget: string }
              - { label: "Extra name in brackets (optional)", name: captionExtra, widget: string, hint: "e.g. Stew Rewart" }
              - { label: "Spoof song title (optional)", name: songTitle, widget: string }
              - { label: "Photo", name: image, widget: image }
              - { label: "Not finished yet", name: comingSoon, widget: boolean, default: false }

  - name: nostalgic_days
    label: "Nostalgic Days"
    label_singular: "Nostalgic Days"
    files:
      - name: page
        label: "Edit this page"
        file: content/pages/nostalgic-days.json
        preview_path: nostalgic-days.html
        editor:
          preview: true
        fields:
          - { label: "Page title", name: pageTitle, widget: string }
          - { label: "Short line under the title", name: lede, widget: string }
          - { label: "First introduction paragraph", name: intro, widget: text }
          - { label: "Walkman / 60s–80s intro paragraph", name: musicIntro, widget: text }
          - { label: "First grid heading", name: sectionHeading, widget: string, default: "Remember those days — personalities" }
          - label: "Personality caricatures (first grid)"
            name: characters
            widget: list
            summary: "{{fields.title}}"
            fields: &nd_card_fields
              - { label: "Character name", name: title, widget: string }
              - { label: "Line under the name", name: caption, widget: string, hint: "e.g. imitating Kenny Goodwin" }
              - { label: "Extra line (optional)", name: captionEmphasis, widget: string }
              - { label: "Photo", name: image, widget: image, required: false }
              - label: "Audio sample"
                name: audio
                widget: file
                required: false
                media_folder: versions/modern-gold/audio
                public_folder: audio
              - { label: "Not finished yet", name: comingSoon, widget: boolean, default: false }
          - { label: "Second grid heading", name: musicSectionHeading, widget: string, default: "Musical mimic songs" }
          - label: "Musical mimic songs (second grid)"
            name: musicCharacters
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: "Character name", name: title, widget: string }
              - { label: "Line under the name", name: caption, widget: string }
              - { label: "Spoof song title", name: songTitle, widget: string, required: false }
              - { label: "Photo", name: image, widget: image, required: false }
              - label: "Audio sample"
                name: audio
                widget: file
                required: false
                media_folder: versions/modern-gold/audio
                public_folder: audio
              - { label: "Not finished yet", name: comingSoon, widget: boolean, default: false }

  - name: news
    label: "News"
    label_singular: "News"
    files:
      - name: page
        label: "Edit this page"
        file: content/pages/news.json
        preview_path: news.html
        editor:
          preview: true
        fields:
          - { label: "Page heading", name: heading, widget: string }
          - { label: "Main text", name: body, widget: text }
          - { label: "Button text", name: buttonLabel, widget: string }
          - { label: "Button link (web address)", name: buttonUrl, widget: string, hint: "Must start with https://" }

  - name: contact
    label: "Contact"
    label_singular: "Contact"
    files:
      - name: page
        label: "Edit this page"
        file: content/pages/contact.json
        preview_path: contact.html
        editor:
          preview: true
        fields:
          - { label: "Page heading", name: heading, widget: string, default: "Contact" }
          - { label: "Introduction", name: body, widget: text }
          - { label: "Show email address on page", name: showEmail, widget: boolean, default: true }
          - { label: "Email address", name: email, widget: string }
          - label: "Contact form"
            name: form
            widget: object
            collapsed: false
            fields:
              - { label: "Show the form", name: enabled, widget: boolean, default: true }
              - { label: "Form heading", name: heading, widget: string, default: "Send a message" }
              - { label: "Text above the form", name: intro, widget: text }
              - { label: "Submit button text", name: submitLabel, widget: string, default: "Send message" }
              - { label: "Success message", name: successMessage, widget: string }
              - { label: "Error message", name: errorMessage, widget: string }
              - label: "Web3Forms access key"
                name: web3formsAccessKey
                widget: string
                hint: "Free at web3forms.com — messages go to your email. Leave blank until you have a key."
              - label: "Cloudflare Turnstile site key (captcha)"
                name: turnstileSiteKey
                widget: string
                hint: "Get keys at dash.cloudflare.com → Turnstile. Use 1x00000000000000000000AA for testing."
              - label: "Form fields"
                name: fields
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { label: "Field name (internal)", name: name, widget: string, hint: "e.g. name, email, message" }
                  - { label: "Label shown to visitors", name: label, widget: string }
                  - { label: "Field type", name: type, widget: select, options: ["text", "email", "tel", "textarea"], default: "text" }
                  - { label: "Required", name: required, widget: boolean, default: true }
                  - { label: "Placeholder (optional)", name: placeholder, widget: string, required: false }
